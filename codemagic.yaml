workflows:
  android-production:
    name: ZOLD Android Production
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      groups:
        - zold_env          # holds BASE_URL, RAZORPAY_KEY, RISK_DISCLOSURE_PDF_URL, CONNECT_TIMEOUT, RECEIVE_TIMEOUT, PRIVACY_POLICY_URL, WEB_URL
        - zold_android_signing  # holds CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_ALIAS_PASSWORD
        # zold_play_credentials intentionally not included yet: Play Console requires the FIRST release of a
        # new app to be uploaded manually before API-based publishing (google_play block below) can work.
        # Re-add this group and un-comment the `google_play:` block once that first manual upload is done.
      vars:
        PACKAGE_NAME: "in.zold.app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: "v*.*.*"
          include: true
    scripts:
      - name: Write .env from secure variables
        script: |
          cat <<EOF > "$CM_BUILD_DIR/.env"
          BASE_URL=$BASE_URL
          RAZORPAY_KEY=$RAZORPAY_KEY
          RISK_DISCLOSURE_PDF_URL=$RISK_DISCLOSURE_PDF_URL
          CONNECT_TIMEOUT=$CONNECT_TIMEOUT
          RECEIVE_TIMEOUT=$RECEIVE_TIMEOUT
          PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL
          WEB_URL=$WEB_URL
          EOF

      - name: Set up Android signing
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android/app/keystore.jks"
          cat <<EOF > "$CM_BUILD_DIR/android/key.properties"
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_ALIAS_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=keystore.jks
          EOF

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build AAB
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - dme@botivate.in
        notify:
          success: true
          failure: true
      # google_play publishing disabled until the first .aab is uploaded to Play Console manually
      # (Google requires this for a brand-new app before API-based publishing is allowed).
      # Once done: re-add the zold_play_credentials group above and uncomment this block.
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true
